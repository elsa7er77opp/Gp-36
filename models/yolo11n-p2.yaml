# GP36 — YOLO11n with an extra P2 (stride-4) detection head, for tiny / far potholes.
# Idea as in SBP-YOLO (arXiv 2508.01339) and Ultralytics' yolov8-p2.yaml: add a stride-4 output fed by the
# backbone's P2 feature, so objects of ~4-16 px at the training size get their own anchor-free grid.
# Same backbone as yolo11.yaml (Ultralytics 8.3/8.4), so `YOLO("models/yolo11n-p2.yaml").load("yolo11n.pt")`
# transfers all backbone weights and the parts of the neck whose shapes match; the P2 branch starts random.
# The file name carries the scale ("n"), which Ultralytics reads from the name.
# Build check (CPU, no data): python -I tools/check_model_yaml.py models/yolo11n-p2.yaml
# Cost: more GFLOPs and more post-processing (4x more grid cells at stride 4); latency must be re-measured with
# tools/latency_bench.py before any deployment decision.

nc: 2 # 0 pothole, 1 speed_bump
scales: # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (P2 feature)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 (P3 feature)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6 (P4 feature)
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  # top-down
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17
  - [[-1, 2], 1, Concat, [1]] # 18 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 19 (P2/4-xsmall)
  # bottom-up
  - [-1, 1, Conv, [128, 3, 2]] # 20
  - [[-1, 16], 1, Concat, [1]] # 21 cat head P3
  - [-1, 2, C3k2, [256, False]] # 22 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]] # 23
  - [[-1, 13], 1, Concat, [1]] # 24 cat head P4
  - [-1, 2, C3k2, [512, False]] # 25 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]] # 26
  - [[-1, 10], 1, Concat, [1]] # 27 cat head P5
  - [-1, 2, C3k2, [1024, True]] # 28 (P5/32-large)

  - [[19, 22, 25, 28], 1, Detect, [nc]] # Detect(P2, P3, P4, P5)
